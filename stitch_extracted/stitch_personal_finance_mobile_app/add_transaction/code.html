_full</span></div></div><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go Back" class="w-11 h-11 -ml-space-xs flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/60 transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Add Transaction</h1></div><div class="flex items-center gap-space-sm"><button aria-label="More options" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/60 transition-colors"><span class="material-symbols-outlined text-[22px]">more_vert</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-25 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-24 space-y-space-lg">
<!-- Interactive Pill Type Switcher -->
<div class="w-full bg-surface-container-low p-1.5 rounded-full flex items-center justify-between shadow-sm">
<button class="flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-300 bg-primary-container text-on-primary-container shadow-md flex items-center justify-center gap-1.5" id="type-expense" onclick="switchType('expense')">
<span class="material-symbols-outlined text-[16px]">arrow_downward</span>
      Expense
    </button>
<button class="flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-300 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5" id="type-income" onclick="switchType('income')">
<span class="material-symbols-outlined text-[16px]">arrow_upward</span>
      Income
    </button>
</div>
<!-- Hero Amount Display with Realistic Interactive Keying -->
<div class="flex flex-col items-center justify-center pt-space-xs pb-space-sm text-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Transaction Amount</span>
<div class="inline-flex items-baseline justify-center font-display-lg text-display-lg tracking-tight text-on-surface">
<span class="text-primary mr-1 font-semibold">₦</span>
<span class="tabular-nums font-bold" id="amount-val">18,500</span>
<span class="text-on-surface-variant text-headline-sm font-medium">.00</span>
<span class="inline-block w-0.5 h-8 ml-1 bg-primary animate-pulse self-center rounded-full"></span>
</div>
<!-- Quick Increment Bubbles -->
<div class="flex items-center gap-space-sm mt-3">
<button class="px-2.5 py-1 rounded-full bg-surface-container-high hover:bg-surface-bright text-on-surface-variant text-label-sm font-label-sm transition-all active:scale-95" onclick="adjustAmount(1000)">+₦1k</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container-high hover:bg-surface-bright text-on-surface-variant text-label-sm font-label-sm transition-all active:scale-95" onclick="adjustAmount(5000)">+₦5k</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container-high hover:bg-surface-bright text-on-surface-variant text-label-sm font-label-sm transition-all active:scale-95" onclick="adjustAmount(10000)">+₦10k</button>
<button class="px-2 py-1 rounded-full bg-surface-container text-outline text-label-sm font-label-sm hover:text-on-surface transition-all active:scale-95" onclick="clearAmount()">Reset</button>
</div>

<div class="flex flex-col space-y-space-sm">
<div class="flex items-center justify-between">
<h2 class="font-title-md text-title-md text-on-surface tracking-tight">Select Category</h2>
<span class="font-label-md text-label-md text-primary font-semibold" id="selected-category-label">Food &amp; Dining</span>
</div>
<div class="grid grid-cols-4 gap-2.5" id="category-grid">
<!-- 1. Food (Selected default) -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-highest transition-all duration-200 active:scale-95 relative shadow-sm" onclick="selectCategory('Food', 'restaurant', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-tertiary shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface font-medium truncate max-w-full">Food</span>
<span class="category-glow absolute inset-0 rounded-xl bg-primary/10 pointer-events-none"></span>
</button>
<!-- 2. Transport -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Transport', 'directions_car', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-primary shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">directions_car</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Transport</span>
</button>
<!-- 3. Shopping -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Shopping', 'shopping_bag', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-primary-fixed shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Shopping</span>
</button>
<!-- 4. Bills -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Bills', 'receipt_long', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-secondary shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">receipt_long</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Bills</span>
</button>
<!-- 5. Entertainment -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Entertainment', 'sports_esports', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-tertiary-fixed-dim shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">sports_esports</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Entertainment</span>
</button>
<!-- 6. Health -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Health', 'favorite', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-secondary-fixed shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">favorite</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Health</span>
</button>
<!-- 7. Home -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Home', 'home', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-on-secondary-fixed-variant shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">home</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Home</span>
</button>
<!-- 8. Education -->
<button class="category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative" onclick="selectCategory('Education', 'school', this)">
<div class="w-11 h-11 rounded-lg bg-surface-container-low flex items-center justify-center text-primary-fixed-dim shadow-inner mb-1.5 transition-transform group-hover:scale-105">
<span class="material-symbols-outlined text-[24px]">school</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full">Education</span>
</button>
</div>
</div>
<!-- Form Fields (Description & Date) -->
<div class="space-y-space-md">
<!-- Description Field -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant block" for="desc-input">Description</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-3 focus-within:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">edit_note</span>
<input class="bg-transparent text-on-surface font-body-md text-body-md placeholder:text-outline w-full focus:outline-none" id="desc-input" placeholder="e.g. Lunch at Yellow Chilli" type="text" value="Lunch at Yellow Chilli, VI"/>
</div>
</div>
<!-- Date Picker Field -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant block">Date</label>
<button class="w-full flex items-center justify-between bg-surface-container-low rounded-xl px-3.5 py-3 text-left hover:bg-surface-container transition-colors active:scale-[0.99]">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary text-[20px] mr-2.5">calendar_today</span>
<span class="font-body-md text-body-md text-on-surface">Today, Dec 24, 2024</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">expand_more</span>
</button>
</div>
</div>
<!-- Payment Method Selector -->
<div class="space-y-space-sm">
<label class="font-label-md text-label-md text-on-surface-variant block">Payment Method</label>
<div class="grid grid-cols-3 gap-2.5" id="payment-methods">
<!-- Cash (Selected) -->
<button class="payment-method-pill flex items-center justify-center gap-2 py-3 px-2 rounded-xl bg-primary-container text-on-primary-container font-label-lg text-label-lg shadow-sm transition-all duration-200" onclick="selectPayment(this)">
<span class="material-symbols-outlined text-[18px]">payments</span>
<span>Cash</span>
</button>
<!-- Debit Card -->
<button class="payment-method-pill flex items-center justify-center gap-2 py-3 px-2 rounded-xl bg-surface-container-low text-on-surface-variant hover:text-on-surface hover:bg-surface-container font-label-lg text-label-lg transition-all duration-200" onclick="selectPayment(this)">
<span class="material-symbols-outlined text-[18px]">credit_card</span>
<span>Card</span>
</button>
<!-- Bank Transfer -->
<button class="payment-method-pill flex items-center justify-center gap-2 py-3 px-2 rounded-xl bg-surface-container-low text-on-surface-variant hover:text-on-surface hover:bg-surface-container font-label-lg text-label-lg transition-all duration-200" onclick="selectPayment(this)">
<span class="material-symbols-outlined text-[18px]">account_balance</span>
<span>Bank</span>
</button>
</div>
</div>
<!-- Offline Discretion Ledger Notice -->
<div class="flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-surface-container-lowest text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-[16px]">sync_saved_locally</span>
<span class="font-label-sm text-label-sm">Saved locally via SQLite — auto-syncs on network</span>
</div>
<!-- Primary Action Container -->
<div class="pt-2 flex flex-col items-center space-y-3">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm shadow-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] hover:brightness-110" id="save-btn" onclick="triggerSaveAnimation()">
<span class="material-symbols-outlined text-[20px]" id="btn-icon">check_circle</span>
<span id="btn-text">Save Transaction</span>
</button>
<!-- Contextual Delete Transaction Trigger -->
<button class="py-2 px-4 rounded-full text-error font-label-lg text-label-lg hover:bg-error-container/20 transition-colors flex items-center gap-1.5 opacity-80 hover:opacity-100" onclick="triggerDelete()">
<span class="material-symbols-outlined text-[18px]">delete</span>
<span>Delete Transaction</span>
</button>
</div>
</div>
<script>
  let currentAmount = 18500;
  let isExpense = true;

  function switchType(type) {
    const expenseBtn = document.getElementById('type-expense');
    const incomeBtn = document.getElementById('type-income');
    const saveBtn = document.getElementById('save-btn');

    if (type === 'expense') {
      isExpense = true;
      expenseBtn.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-300 bg-primary-container text-on-primary-container shadow-md flex items-center justify-center gap-1.5';
      incomeBtn.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-300 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5';
      saveBtn.className = 'w-full h-14 rounded-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm shadow-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] hover:brightness-110';
    } else {
      isExpense = false;
      incomeBtn.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-300 bg-secondary text-on-secondary shadow-md flex items-center justify-center gap-1.5';
      expenseBtn.className = 'flex-1 py-2.5 rounded-full font-label-lg text-label-lg transition-all duration-300 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5';
      saveBtn.className = 'w-full h-14 rounded-full bg-secondary text-on-secondary font-headline-sm text-headline-sm shadow-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] hover:brightness-110';
    }
  }

  function adjustAmount(val) {
    currentAmount += val;
    renderAmount();
  }

  function clearAmount() {
    currentAmount = 0;
    renderAmount();
  }

  function renderAmount() {
    document.getElementById('amount-val').textContent = currentAmount.toLocaleString('en-NG');
  }

  function selectCategory(name, icon, element) {
    const allCards = document.querySelectorAll('.category-card');
    allCards.forEach(card => {
      card.className = 'category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container transition-all duration-200 hover:bg-surface-container-high active:scale-95 relative';
      const label = card.querySelector('span:last-of-type');
      if (label && !card.querySelector('.category-glow')) {
        label.className = 'font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full';
      }
      const existingGlow = card.querySelector('.category-glow');
      if (existingGlow) existingGlow.remove();
    });

    element.className = 'category-card group flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-highest transition-all duration-200 active:scale-95 relative shadow-sm';
    const label = element.querySelector('span:last-of-type');
    label.className = 'font-label-sm text-label-sm text-on-surface font-medium truncate max-w-full';
    
    const glow = document.createElement('span');
    glow.className = 'category-glow absolute inset-0 rounded-xl bg-primary/10 pointer-events-none';
    element.appendChild(glow);

    document.getElementById('selected-category-label').textContent = name;
  }

  function selectPayment(element) {
    const allPills = document.querySelectorAll('.payment-method-pill');
    allPills.forEach(pill => {
      pill.className = 'payment-method-pill flex items-center justify-center gap-2 py-3 px-2 rounded-xl bg-surface-container-low text-on-surface-variant hover:text-on-surface hover:bg-surface-container font-label-lg text-label-lg transition-all duration-200';
    });

    element.className = 'payment-method-pill flex items-center justify-center gap-2 py-3 px-2 rounded-xl bg-primary-container text-on-primary-container font-label-lg text-label-lg shadow-sm transition-all duration-200';
  }

  function triggerSaveAnimation() {
    const btn = document.getElementById('save-btn');
    const text = document.getElementById('btn-text');
    const icon = document.getElementById('btn-icon');

    icon.textContent = 'hourglass_empty';
    text.textContent = 'Recording Ledger...';
    btn.classList.add('opacity-90');

    setTimeout(() => {
      icon.textContent = 'done_all';
      text.textContent = 'Transaction Logged!';
      btn.className = 'w-full h-14 rounded-full bg-secondary text-on-secondary font-headline-sm text-headline-sm shadow-xl flex items-center justify-center gap-2 transition-all duration-200';

      setTimeout(() => {
        if (history.length > 1) {
          history.back();
        } else {
          text.textContent = 'Saved!';
        }
      }, 700);
    }, 500);
  }

  function triggerDelete() {
    if (confirm('Are you sure you want to remove this record?')) {
      history.back();
    }
  }
</script></main></body></html>
